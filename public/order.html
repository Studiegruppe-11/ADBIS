<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestilling</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <a href="/"><img src="\img\DI logo 2400x1330_u_txt.png" class="siteLogo"></a>
        <div class="right-header">
            <div class="user-info">
                <span>John</span>
                <button id="adminButton">Admin Links</button>
                <button>Log ud</button>
            </div>
        </div>
    </header>
    <div id="adminLinks" class="admin-links" style="display: none;">
        <a href="/">Bestil</a>
        <a href="/orders">Ordrer</a>
        <a href="/tasks">Opgaver</a>
        <a href="/orderRoom">Ordre-Lokale</a>
        <a href="/api/rooms">Lokaler API</a>
        <a href="/api/orders">Ordrer API</a>
        <a href="/api/tasks/tasks">Opgave API</a>
        <a href="/api/tasks/order-tasks">Ordre-Opgave API</a>
    </div>
    <div class="container">
        <form id="orderForm">
            <!-- Event navn -->
            <div class="event-info">
                <label for="eventName">Navn på arrangement</label>
                <input type="text" id="eventName" name="eventName" required tabindex="1">
            </div>
            <!-- Dato -->
            <div class="date-info">
                <label for="date">Dato</label>
                <input type="date" id="date" name="date" required tabindex="2">
            </div>
            <!-- Antal gæster -->
            <div class="guests-info">
                <label for="guests">Antal personer</label>
                <input type="number" id="guests" name="guests" min="1" required tabindex="3">
            </div>
            <!-- Tid -->
            <div class="start-info">
                <label for="startTime">Starttidspunkt</label>
                <input type="time" id="startTime" name="startTime" required tabindex="4">
            </div>
            <div class="end-info">
                <label for="endTime">Sluttidspunkt</label>
                <input type="time" id="endTime" name="endTime" required tabindex="6">
            </div>
            <!-- Serveringstid -->
            <div class="serving-info">
                <label for="servingTime">Serveringstidspunkt</label>
                <input type="time" id="servingTime" name="servingTime" required tabindex="5">
            </div>
            <!-- Menuvalg -->
            <div class="menu menu1">
                <label for="menu1">Menu 1</label>
                <select id="menu1" name="menu1" tabindex="7"></select>
            </div>
            <div class="menu menu2">
                <label for="menu2">Menu 2</label>
                <select id="menu2" name="menu2" tabindex="8"></select>
            </div>
            <div class="menu menu3">
                <label for="menu3">Menu 3</label>
                <select id="menu3" name="menu3" tabindex="9"></select>
            </div>
            <button type="submit" tabindex="10">Opret ordre</button>
        </form>
    </div> 


<script src="/socket.io/socket.io.js"></script>
<script src="socket-handler.js"></script>
<script src="updateFunctions.js"></script>
<script src="script.js"></script>
</body>
</html>
